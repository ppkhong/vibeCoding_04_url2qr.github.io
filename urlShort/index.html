<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 단축 - QR &amp; Shorten Studio</title>
    <meta name="description" content="긴 URL을 짧은 링크로 변환하고 클립보드에 복사하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="ambient-glow orb-1" aria-hidden="true"></div>
    <div class="ambient-glow orb-2" aria-hidden="true"></div>
    <div class="ambient-glow orb-3" aria-hidden="true"></div>
    <div class="bg-grid-pattern" aria-hidden="true"></div>

    <header class="app-header">
        <a class="logo-wrapper" href="../index.html" title="홈으로 이동">
            <img src="../img/logo.png" alt="QR &amp; Shorten Studio Logo" class="brand-logo" onerror="this.style.display='none';">
            <div class="brand-badge">
                <span class="badge-dot"></span>
                <span>URL Shortener</span>
            </div>
        </a>
        <div class="header-actions">
            <a class="btn-icon" href="../index.html">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>홈</span>
            </a>
        </div>
    </header>

    <main class="app-container">
        <section class="hero-intro">
            <div class="hero-pill">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <span>Instant Link Shortening</span>
            </div>
            <h1 class="hero-title">
                긴 주소를 <span class="gradient-text">짧은 링크</span>로<br>
                한 번에 <span class="gradient-text glow">변환</span>하세요
            </h1>
            <p class="hero-desc">
                URL을 입력하고 단축하기를 누르면 공유하기 쉬운 짧은 주소가 만들어집니다.
            </p>
        </section>

        <section class="shortener-card" aria-live="polite">
            <form class="shortener-form" id="shortenForm" autocomplete="off" novalidate>
                <div class="field-group">
                    <label class="field-label" for="longUrl">URL 입력</label>
                    <div class="input-inner-wrapper" id="inputWrapper">
                        <div class="input-icon-left" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                        </div>
                        <input
                            type="text"
                            id="longUrl"
                            class="url-input-field"
                            placeholder="단축할 URL을 입력하세요 (예: https://example.com/very/long/path)"
                            aria-label="URL 입력"
                            spellcheck="false"
                            autofocus
                        >
                        <button type="button" class="btn-clear-input" id="btnClear" title="내용 지우기" aria-label="입력 내용 지우기">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-shorten" id="btnShorten" disabled>
                    <span class="btn-shorten-label">단축하기</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>

                <div class="field-group">
                    <label class="field-label" for="shortUrl">단축된 URL</label>
                    <div class="output-wrapper">
                        <input
                            type="text"
                            id="shortUrl"
                            class="url-output-field"
                            placeholder="단축 결과가 여기에 표시됩니다"
                            aria-label="단축된 URL (읽기 전용)"
                            readonly
                        >
                        <button type="button" class="btn-copy" id="btnCopy" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <span>복사</span>
                        </button>
                    </div>
                </div>

                <p class="form-message" id="formMessage" role="status"></p>
            </form>

            <p class="card-footnote">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <span>is.gd OpenAPI를 통해 단축되며, 입력한 주소는 서버에 저장되지 않습니다.</span>
            </p>
        </section>
    </main>

    <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

    <script src="js/app.js"></script>
</body>
</html>
