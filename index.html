<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR &amp; Shorten Studio - QR코드 생성 · URL 단축</title>
    <meta name="description" content="URL을 QR코드로 만들거나, 긴 주소를 짧은 링크로 단축하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <div class="ambient-glow orb-1" aria-hidden="true"></div>
    <div class="ambient-glow orb-2" aria-hidden="true"></div>
    <div class="ambient-glow orb-3" aria-hidden="true"></div>
    <div class="bg-grid-pattern" aria-hidden="true"></div>

    <header class="app-header">
        <div class="logo-wrapper">
            <img src="img/logo.png" alt="QR &amp; Shorten Studio Logo" class="brand-logo" onerror="this.style.display='none';">
            <div class="brand-badge">
                <span class="badge-dot"></span>
                <span>Link Toolkit</span>
            </div>
        </div>
    </header>

    <main class="landing-container">
        <section class="hero-intro">
            <div class="hero-pill">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <span>One Link, Two Ways</span>
            </div>
            <h1 class="hero-title">
                링크를 <span class="gradient-text">QR코드</span>로<br>
                또는 <span class="gradient-text glow">짧은 주소</span>로
            </h1>
            <p class="hero-desc">
                원하는 기능을 선택하세요. 두 가지 도구 모두 설치 없이 브라우저에서 바로 사용할 수 있습니다.
            </p>
        </section>

        <section class="feature-grid" aria-label="기능 선택">
            <a class="feature-card" href="url2qr/index.html" id="cardQr">
                <div class="feature-glow" aria-hidden="true"></div>
                <div class="feature-icon icon-qr">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                        <path d="M14 14h3v3h-3z"></path>
                        <path d="M21 14v3M21 21h-3M17 21h-3v-3M14 18h-1"></path>
                    </svg>
                </div>
                <div class="feature-body">
                    <h2 class="feature-title">QR코드</h2>
                    <p class="feature-desc">
                        URL을 입력하면 즉시 QR코드가 완성됩니다. 고해상도 JPG로 다운로드할 수 있습니다.
                    </p>
                </div>
                <span class="feature-cta">
                    <span>QR코드 만들기</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </a>

            <a class="feature-card" href="urlShort/index.html" id="cardShort">
                <div class="feature-glow" aria-hidden="true"></div>
                <div class="feature-icon icon-short">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </div>
                <div class="feature-body">
                    <h2 class="feature-title">URL단축</h2>
                    <p class="feature-desc">
                        길고 복잡한 주소를 한 번의 클릭으로 짧은 링크로 바꾸고 바로 복사하세요.
                    </p>
                </div>
                <span class="feature-cta">
                    <span>URL 단축하기</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </a>
        </section>

        <p class="landing-footnote">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>모든 작업은 브라우저에서 처리되며 입력한 URL은 저장되지 않습니다.</span>
        </p>
    </main>
</body>
</html>
